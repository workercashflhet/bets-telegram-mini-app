<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PvP Колесо</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pvp.css">
</head>
<body class="fullscreen-mode">
    <div id="app">
        <!-- ФИКСИРОВАННЫЙ КОНТЕЙНЕР ДЛЯ ОСТРОВКОВ -->
        <div class="islands-container">
            <!-- Левый островок с профилем -->
            <div class="user-island">
                <img src="assets/avatar.png" alt="Avatar" class="user-avatar" id="pvpUserAvatar">
                <span class="user-name" id="pvpUserNameDisplay">User</span>
            </div>
            <!-- Правый островок с балансом -->
            <div class="balance-wrapper">
                <div class="balance-island">
                    <div class="balance-item">
                        <span class="balance-value" id="pvpTonBalance">0.00</span>
                        <img src="assets/ton.png" alt="TON" class="balance-icon">
                    </div>
                    <div class="balance-divider"></div>
                    <div class="balance-item">
                        <span class="balance-value" id="pvpStarsBalance">0</span>
                        <img src="assets/stars.png" alt="Stars" class="balance-icon">
                    </div>
                </div>
                <button class="balance-deposit-btn" id="pvpDepositBtn" title="Deposit">+</button>
            </div>
        </div>

        <!-- Верхний бар (Header) с оберткой для островков -->
        <div class="pvp-header-wrapper">
            <div class="pvp-header-bar">
                <div class="header-left">
                    <button class="header-btn" id="historyBtn" title="История">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M12 8v4l3 3M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
                        </svg>
                    </button>
                    <div class="info-block">
                        <span class="info-label">ПРЕД. ИГРА</span>
                        <span class="info-value" id="prevGameText">—</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="info-block">
                        <span class="info-label">ТОП ИГРА</span>
                        <span class="info-value" id="topGameText">—</span>
                    </div>
                    <button class="header-btn" id="chatBtn" title="Чат">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Мои ставки -->
        <div class="my-bets-bar hidden" id="myBetsBar">
            <span id="myBetsText">My bets: 0 TON + 0 Stars</span>
            <span class="bets-count" id="winChance">0%</span>
        </div>

        <!-- Статистика -->
        <div class="pvp-stats">
            <div class="stat-box">
                <div class="stat-label">Pool</div>
                <div class="stat-value" id="poolTotal">
                    0.00 <img src="assets/ton.png" alt="TON" class="pool-icon">
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Players</div>
                <div class="stat-value" id="playersCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="roundNumber">#0</div>
            </div>
        </div>

        <!-- Колесо -->
        <div class="wheel-wrapper" id="wheelWrapper">
            <div class="wheel-container">
                <div class="wheel" id="wheel">
                    <!-- Сегменты будут добавлены динамически -->
                </div>
                <div class="wheel-center-solid" id="wheelHub">
                    <div class="hub-content" id="hubContent">
                        <div class="hub-timer" id="hubTimer">20</div>
                        <div class="hub-status" id="hubStatus">Ожидание</div>
                    </div>
                </div>
                <div class="wheel-pointer"></div>
            </div>
        </div>

        <!-- Статус спиннинга -->
        <div class="spinning-status hidden" id="spinningStatus">
            <div class="spinning-text">🎡 Колесо крутится...</div>
        </div>

        <!-- Победитель -->
        <div class="winner-section hidden" id="winnerSection">
            <div class="winner-crown">👑</div>
            <div class="winner-announcement" id="winnerName">Игрок</div>
            <div class="winner-prize" id="winnerPrize">
                0.00 <img src="assets/ton.png" alt="TON" class="winner-prize-icon">
            </div>
            <button class="new-round-button" id="newRoundBtn">🔄 Новый раунд</button>
        </div>

        <!-- Секция ставок -->
        <div class="bet-section" id="betSection">
            <div class="currency-toggle">
                <button class="currency-btn active" data-currency="ton">
                    <img src="assets/ton.png" alt="TON" class="currency-icon">
                    TON
                </button>
                <button class="currency-btn" data-currency="stars">
                    <img src="assets/stars.png" alt="Stars" class="currency-icon">
                    Stars
                </button>
            </div>

            <div class="bet-input-group">
                <button class="bet-adjust" id="betDec">−</button>
                <input type="text" class="bet-input" id="betInput" value="1.0" inputmode="decimal" placeholder="0.0">
                <button class="bet-adjust" id="betInc">+</button>
            </div>

            <!-- Быстрые ставки -->
            <div class="quick-bets" id="quickBets">
                <button class="quick-bet-btn" data-amount="0.1">0.1</button>
                <button class="quick-bet-btn" data-amount="0.5">0.5</button>
                <button class="quick-bet-btn" data-amount="1.0">1.0</button>
            </div>

            <button class="place-bet-button" id="placeBetBtn">Сделать ставку</button>
        </div>

        <!-- Список игроков -->
        <div class="players-compact">
            <div class="players-header">
                <span>👥 Игроки</span>
                <span id="playersCountCompact">0</span>
            </div>
            <div class="players-list-compact" id="playersListCompact">
                <div class="no-players-compact">Нет игроков</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно победителя -->
    <div class="winner-modal" id="winnerModal">
        <div class="winner-modal-content">
            <div class="winner-modal-icon">🏆</div>
            <div class="winner-modal-title">ПОБЕДИТЕЛЬ</div>
            <div class="winner-modal-name" id="winnerModalName">Игрок</div>
            <div class="winner-modal-stats">
                <div class="winner-stat">
                    <span class="winner-stat-label">Раунд</span>
                    <span class="winner-stat-value" id="winnerModalRound">#0000</span>
                </div>
                <div class="winner-stat">
                    <span class="winner-stat-label">Выигрыш</span>
                    <span class="winner-stat-value winner-prize" id="winnerModalPrize">
                        0.00 <img src="assets/ton.png" alt="TON" class="winner-modal-icon-small">
                    </span>
                </div>
                <div class="winner-stat">
                    <span class="winner-stat-label">Множитель</span>
                    <span class="winner-stat-value winner-multiplier" id="winnerModalMultiplier">×0.0</span>
                </div>
            </div>
            <button class="winner-modal-btn" id="winnerModalBtn">🔄 Новый раунд</button>
        </div>
    </div>

    <script src="pvp.js"></script>
</body>
</html>
