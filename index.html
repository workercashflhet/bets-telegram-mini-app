            <!-- Вкладка Profile -->
            <div class="tab-content" id="tab-profile">
                <div class="placeholder-content">
                    <span class="placeholder-icon">👤</span>
                    <h2 class="placeholder-title">Profile</h2>
                    <p class="placeholder-text">User profile information</p>
                </div>
            </div>

            <!-- Вкладка Game (активная по умолчанию) -->
            <div class="tab-content active" id="tab-game">
                <div class="game-content">
                    <!-- Карусель с баннерами -->
                    <div class="carousel-container">
                        <div class="carousel-track" id="carouselTrack">
                            <a href="https://t.me/itsrefinelife" target="_blank" rel="noopener" class="carousel-slide">
                                <img src="assets/banner.jpg" alt="Banner 1" class="carousel-image">
                            </a>
                            <a href="https://t.me/itsrefinelife" target="_blank" rel="noopener" class="carousel-slide">
                                <img src="assets/banner2.jpg" alt="Banner 2" class="carousel-image">
                            </a>
                        </div>
                        
                        <!-- Точки навигации -->
                        <div class="carousel-dots" id="carouselDots">
                            <span class="dot active" data-index="0"></span>
                            <span class="dot" data-index="1"></span>
                        </div>
                    </div>

                    <!-- Заголовок "Все игры" -->
                    <div class="games-title">
                        <span class="games-title-text">Все игры</span>
                    </div>

                    <!-- Карточки под каруселью -->
                    <div class="game-cards-row">
                        <div class="game-card">
                            <img src="assets/game1.jpg" alt="Game Card 1" class="game-card-image">
                        </div>
                        <div class="game-card">
                            <img src="assets/game2.jpg" alt="Game Card 2" class="game-card-image">
                        </div>
                    </div>

                    <!-- Третья карточка (на всю ширину) -->
                    <div class="game-card-full">
                        <img src="assets/game3.jpg" alt="Game Card 3" class="game-card-full-image">
                    </div>

                    <!-- Кнопка "Бесплатный спин" -->
                    <button class="free-spin-btn" id="freeSpinBtn">
                        <span class="free-spin-text">🎰 Бесплатный спин</span>
                    </button>
                </div>
            </div>

            <!-- Вкладка Settings -->
            <div class="tab-content" id="tab-settings">
                <div class="placeholder-content">
                    <span class="placeholder-icon">⚙️</span>
                    <h2 class="placeholder-title">Settings</h2>
                    <p class="placeholder-text">App settings and preferences</p>
                </div>
            </div>
